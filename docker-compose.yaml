services:
  # ==========================================
  # Backend Laravel (API)
  # ==========================================
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: "QuizBall"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:7v+2jTSnRNtupINEG5k1s0wDa68hxNlS0ZYh9ARkpUg=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      DB_CONNECTION: mysql
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      TRUSTED_PROXIES: "*"
    volumes:
      - storage_data:/var/www/html/storage
    expose:
      - "80"
    networks:
      - quizball_network

  # ==========================================
  # Frontend React (Vite + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 80
    expose:
      - "80"
    networks:
      - quizball_network

volumes:
  storage_data:
    driver: local

networks:
  quizball_network:
    driver: bridge
