services:
  # ==========================================
  # Backend Laravel (API)
  # ==========================================
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: quizball_backend
    restart: unless-stopped
    environment:
      APP_NAME: "QuizBall"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-quizball}
      DB_USERNAME: ${DB_USERNAME:-quizball}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      TRUSTED_PROXIES: "*"
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - quizball_network

  # ==========================================
  # Frontend React (Vite + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: quizball_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 80
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - quizball_network

volumes:
  storage_data:
    driver: local

networks:
  quizball_network:
    driver: bridge
